# Every push to main publishes a release: trigger-release picks the next
# version (or takes the pushed v* tag) and writes the update notes from the
# commits since the last release; the Windows app and the terminal builds are
# made as Makefile targets; mirror-release gathers the files, writes
# SHA256SUMS and creates the GitHub release with those notes.
#
# The macOS app (signed and notarised) and the Linux app (GTK/WebKitGTK via
# cgo) are not built here; the terminal build is the Linux download.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  trigger-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: version and update notes
        id: v
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          else
            last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
            if [ -z "$last" ]; then
              version=v0.1.0
            else
              IFS=. read -r a b c <<< "${last#v}"
              version="v$a.$b.$((c+1))"
            fi
          fi
          prev=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$version" | head -n1 || true)
          range=HEAD
          [ -n "$prev" ] && range="$prev..HEAD"
          {
            echo "## 更新内容"
            echo
            git log "$range" --no-merges --pretty='- %s' | grep -v '^- Merge' || true
            echo
            [ -n "$prev" ] && echo "完整对比：https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${version}"
          } > notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cat notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md
          if-no-files-found: error

  cli:
    needs: trigger-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [darwin, linux, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build
        env:
          VERSION: ${{ needs.trigger-release.outputs.version }}
        run: |
          v=$(printf '%s' "$VERSION" | tr -cd 'A-Za-z0-9._+-')
          make release-cli VERSION="$v" TARGETS=${{ matrix.os }}/${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/jianmu-*
          if-no-files-found: error

  windows-desktop:
    needs: trigger-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build
        env:
          VERSION: ${{ needs.trigger-release.outputs.version }}
        run: |
          v=$(printf '%s' "$VERSION" | tr -cd 'A-Za-z0-9._+-')
          make release-windows VERSION="$v"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-desktop
          path: dist/jianmu-windows-*.exe
          if-no-files-found: error

  mirror-release:
    needs: [trigger-release, cli, windows-desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: .

      - name: SHA256SUMS
        run: cd dist && sha256sum jianmu-* > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.trigger-release.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.trigger-release.outputs.version }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.trigger-release.outputs.version, '-') }}
