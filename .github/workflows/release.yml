# Every push to main publishes a release in three jobs: trigger-release picks the
# next version and writes the update notes from the commits since the last
# release; build cross-compiles every target; publish writes SHA256SUMS and
# creates the GitHub release with those notes.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  trigger-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: version and update notes
        id: v
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          else
            last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
            if [ -z "$last" ]; then
              version=v0.1.0
            else
              n=${last#v}
              version="v$(echo $n | cut -d. -f1).$(echo $n | cut -d. -f2).$(( $(echo $n | cut -d. -f3) + 1 ))"
            fi
          fi
          prev=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$version" | head -n1 || true)
          range=HEAD
          if [ -n "$prev" ]; then range="$prev..HEAD"; fi
          {
            echo '## 更新内容'
            echo
            git log "$range" --no-merges --pretty='- %s' | grep -v '^- Merge' || true
            echo
            if [ -n "$prev" ]; then echo "完整对比：https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${version}"; fi
          } > notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cat notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md
          if-no-files-found: error

  build:
    needs: trigger-release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build every target
        env:
          VERSION: ${{ needs.trigger-release.outputs.version }}
        run: |
          v=$(printf '%s' "$VERSION" | tr -cd 'A-Za-z0-9._+-')
          make release-cli VERSION="$v" TARGETS="darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64"
          make release-windows VERSION="$v"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/jianmu-*
          if-no-files-found: error

  macos:
    needs: trigger-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build the app and its dmg
        env:
          VERSION: ${{ needs.trigger-release.outputs.version }}
        run: |
          v=$(printf '%s' "$VERSION" | tr -cd 'A-Za-z0-9._+-')
          make app VERSION="$v"
          mkdir -p dist
          hdiutil create -volname Jianmu -srcfolder jianmu.app -ov -format UDZO "dist/jianmu-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-${{ matrix.arch }}
          path: dist/jianmu-macos-*.dmg
          if-no-files-found: error

  publish:
    needs: [trigger-release, build, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: .
      - name: SHA256SUMS
        run: cd dist && sha256sum jianmu-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.trigger-release.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.trigger-release.outputs.version }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.trigger-release.outputs.version, '-') }}
